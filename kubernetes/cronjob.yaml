#apiVersion: batch/v1beta1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: amazing-cron-job
spec:
  schedule: '*/1 * * * *'
  startingDeadlineSeconds: 10
  concurrencyPolicy: Allow
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: hello
              image: busybox
              args:
                - /bin/sh
                - -c
                - echo Hello from the Kubernetes cluster!
          restartPolicy: OnFailure
  